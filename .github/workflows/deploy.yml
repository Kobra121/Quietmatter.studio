# Last checked 26/10/2026 11:28
# Publishes the folder "site/" to the Cloudflare Pages project "quietmatter".
# main          -> production (https://quietmatter.studio)
# other branches -> preview (https://<branch>.quietmatter.pages.dev), to check a change before it goes live
name: Deploy

on:
  push:
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the six files are there
        run: |
          for f in index.html legal.html favicon.svg favicon.ico favicon-32.png apple-touch-icon.png; do
            test -f "site/$f" || { echo "missing site/$f"; exit 1; }
          done
      - name: Check the secrets are set
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] || echo "::error::Secret CLOUDFLARE_API_TOKEN is missing"
          [ -n "$A" ] || echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing"
          echo "::notice::account id length ${#A}"
          [ -n "$T" ] && [ -n "$A" ]
      - name: Check the token and the project
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          v=$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "::notice::token verify (user): $(echo "$v" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          va=$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify)
          echo "::notice::token verify (account): $(echo "$va" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          pr=$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/$A/pages/projects)
          echo "::notice::pages projects: $(echo "$pr" | jq -c '{success, names: [.result[]?.name], branch: [.result[]?.production_branch], errors: [.errors[]?.message]}')"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@3 pages deploy site --project-name=quietmatter --branch="${GITHUB_REF_NAME}" --commit-dirty=true 2>&1 | tee wrangler.log || {
            echo "::error::wrangler: $(grep -iE 'error|✘|code' wrangler.log | head -6 | tr '\n' ' ')"
            exit 1
          }
          echo "::notice::$(grep -iE 'deployment complete|https://' wrangler.log | tail -2 | tr '\n' ' ')"
